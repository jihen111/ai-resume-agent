name: ai-resume-agent

services:
  db:
    image: postgres:16-alpine
    container_name: resume_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume}
      POSTGRES_DB: ${POSTGRES_DB:-resume_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume} -d ${POSTGRES_DB:-resume_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD:-resume}@db:5432/${POSTGRES_DB:-resume_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: '["http://localhost:5173"]'
      MAX_UPLOAD_SIZE_MB: 5
      WATCHFILES_FORCE_POLLING: "true"   # hot-reload on a volume mounted from Windows
    # TODO: prefix with "alembic upgrade head &&" once PostgreSQL storage is in place.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app            # hot-reload in development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules         # keep the container's Linux node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend_net

volumes:
  postgres_data:

networks:
  backend_net:
  frontend_net:
